<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320">
<rect width="640" height="320" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a0aec0"/>
    </marker>
  </defs>
<path d="M 205 170 L 265 170" stroke="#a0aec0" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="235" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle" font-weight="normal" font-style="normal">failures &gt;= threshold</text>
<path d="M 375 170 L 435 170" stroke="#a0aec0" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="405" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle" font-weight="normal" font-style="normal">timeout elapsed</text>
<path d="M 450 130 Q 320 60 190 130" stroke="#a0aec0" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="320" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle" font-weight="normal" font-style="normal">probe success</text>
<path d="M 440 135 Q 405 90 370 135" stroke="#a0aec0" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="405" y="102" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle" font-weight="normal" font-style="normal">probe failure</text>
<path d="M 100 145 C 60 110 60 210 100 175" stroke="#a0aec0" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="55" y="160" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568" text-anchor="end" font-weight="normal" font-style="normal">success</text>
<path d="M 370 175 C 410 210 410 110 370 145" stroke="#a0aec0" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="415" y="160" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568" text-anchor="start" font-weight="normal" font-style="normal">tick</text>
<rect x="100" y="135" width="100" height="50" fill="white" stroke="#e2e8f0" stroke-width="1" rx="6"/>
<rect x="100" y="135" width="4" height="50" fill="#22c55e" rx="2"/>
<text x="152" y="165" font-family="Iosevka, Fira Mono, DejaVu Sans Mono, ui-monospace, monospace" font-size="13" fill="#2d3748" text-anchor="middle" font-weight="600" font-style="normal">Closed</text>
<rect x="270" y="135" width="100" height="50" fill="white" stroke="#e2e8f0" stroke-width="1" rx="6"/>
<rect x="270" y="135" width="4" height="50" fill="#ef4444" rx="2"/>
<text x="322" y="165" font-family="Iosevka, Fira Mono, DejaVu Sans Mono, ui-monospace, monospace" font-size="13" fill="#2d3748" text-anchor="middle" font-weight="600" font-style="normal">Open</text>
<rect x="440" y="135" width="100" height="50" fill="white" stroke="#e2e8f0" stroke-width="1" rx="6"/>
<rect x="440" y="135" width="4" height="50" fill="#eab308" rx="2"/>
<text x="492" y="165" font-family="Iosevka, Fira Mono, DejaVu Sans Mono, ui-monospace, monospace" font-size="13" fill="#2d3748" text-anchor="middle" font-weight="600" font-style="normal">HalfOpen</text>
<text x="320" y="295" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle" font-weight="normal" font-style="normal">Closed: failures &lt; threshold | Open: waiting for timeout | HalfOpen: testing recovery</text>
</svg>
