name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-lean:
    name: Build and Test Lean
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and test with lean-action
        uses: leanprover/lean-action@v1
        with:
          use-github-cache: true
          use-mathlib-cache: true
          build-args: ""
          test: false # We run custom test executable below

      - name: Run tests
        run: lake exe tests

      - name: Test executables from prose
        run: ./scripts/test_examples.sh

  build-rust:
    name: Build and Test Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "examples -> target"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  build-and-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Typst
        uses: typst-community/setup-typst@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo bin directory
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-mdbook-plugins-v1

      - name: Install fonts for PDF generation
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-texgyre fonts-dejavu fonts-linuxlibertine

      - name: Download mdbook 0.5.2 (for HTML with admonitions)
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.2/mdbook-v0.5.2-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          mv mdbook ~/.cargo/bin/mdbook-0.5.2

      - name: Download mdbook 0.4.52 (for typst)
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          mv mdbook ~/.cargo/bin/mdbook-0.4.52

      - name: Download mdbook-linkcheck 0.7.7
        run: |
          curl -sSL https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v0.7.7/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip -o linkcheck.zip
          unzip -oq linkcheck.zip mdbook-linkcheck
          chmod +x mdbook-linkcheck
          mv mdbook-linkcheck ~/.cargo/bin/
          rm linkcheck.zip

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Generate SVG illustrations
        run: uv run python -m illustrations docs/src/images

      - name: Build HTML documentation
        run: cd docs && mdbook-0.5.2 build -d book/html

      - name: Install mdbook-typst
        run: command -v mdbook-typst || cargo install mdbook-typst

      - name: Run link checker
        run: cd docs && mdbook-linkcheck -s

      - name: Build typst output
        run: |
          cd docs
          cp book.toml book-html.toml
          cp book-typst.toml book.toml
          mdbook-0.4.52 build
          cp book-html.toml book.toml

      - name: Post-process typst for LaTeX math
        run: cd docs && python3 mangler.py --typst-dir book/pdf

      - name: Compile typst to PDF
        run: cd docs/book/pdf && typst compile book.typst book.pdf

      - name: Copy PDF to HTML output
        run: cp docs/book/pdf/book.pdf docs/book/html/zero-to-qed.pdf

      - name: Upload mdBook artifact
        uses: actions/upload-artifact@v7
        with:
          name: mdbook
          path: docs/book/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Download mdBook artifact
        uses: actions/download-artifact@v8
        with:
          name: mdbook
          path: public

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
