image:
  file: .docker/gitpod/Dockerfile

tasks:
  - name: Setup Lean
    init: |
      elan self update
      lake exe cache get!
      lake build
    command: |
      echo "Lean 4 environment ready!"
      lean --version

vscode:
  extensions:
    - leanprover.lean4

github:
  prebuilds:
    master: true
    branches: true
    pullRequests: true
    pullRequestsFromForks: false
    addCheck: true
    addComment: false
    addBadge: true
